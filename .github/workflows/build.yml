name: Build and release

# Builds the desktop app for Windows, macOS and Linux and publishes the installers as a GitHub Release tagged with the
# app version in package.json (0.52.11 for version 0.52.11). Runs when a push to main changes package.json (a version
# bump) and on demand from the Actions tab. A release that already exists for the version gets its files replaced.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [package.json]

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: read
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install the packages the Linux makers need
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm fakeroot dpkg
      - run: npm ci --legacy-peer-deps
      # The dmg maker needs appdmg, which npm installs only on macOS and skips without a word when its install fails; one
      # run built without it ("Cannot find module 'appdmg'"). This tries again, and stops here with the reason if it cannot.
      - name: Make sure appdmg is installed
        if: runner.os == 'macOS'
        run: |
          for attempt in 1 2 3; do
            node -e "require('appdmg')" && break
            npm install --no-save --legacy-peer-deps appdmg@0.6.6
          done
          node -e "require('appdmg')"
      - name: Build the web app
        run: npm run build
      - name: Make the installers
        run: npm run electron:make
      # The macOS runner is Apple Silicon; this adds the Intel build next to it.
      - name: Make the Intel macOS installers
        if: runner.os == 'macOS'
        run: npx electron-forge make --arch=x64
      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ runner.os }}
          path: out/make/**
          if-no-files-found: error

  # The web version: the built site as a zip, to put on any web server.
  web:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # vuetify-loader asks for Vue 2.7 while the project is on Vue 2.6.
      - run: npm ci --legacy-peer-deps
      - run: npm run build
      - name: Zip the site
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: (cd dist && zip -qr "../VCS-Game-Maker-web-$VERSION.zip" .)
      - uses: actions/upload-artifact@v7
        with:
          name: web
          path: VCS-Game-Maker-web-*.zip
          if-no-files-found: error

  release:
    needs: [version, build, web]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: installers
      - name: Create or update the release
        run: |
          mapfile -t files < <(find installers -type f \( -name '*.exe' -o -name '*.nupkg' -o -name 'RELEASES' -o -name '*.zip' -o -name '*.dmg' -o -name '*.deb' -o -name '*.rpm' \))
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" --target "$GITHUB_SHA" --title "VCS Game Maker $TAG" --generate-notes
          fi
