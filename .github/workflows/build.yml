name: Build and release

# Builds the desktop app for Windows (Intel/AMD and ARM), macOS (Intel and Apple Silicon) and Linux (Intel/AMD and ARM, which covers a 64-bit Raspberry Pi) and publishes the installers as a GitHub Release tagged with the
# app version in package.json (0.52.11 for version 0.52.11). Runs when a push to main changes package.json (a version
# bump) and on demand from the Actions tab. A release that already exists for the version gets its files replaced.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [package.json]

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: read
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm, macos-latest, ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install the packages the Linux makers need
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm fakeroot dpkg squashfs-tools
      - run: npm ci --legacy-peer-deps
      # The Windows installer is an .msi, which the WiX Toolset (candle.exe and light.exe on the PATH) builds. The runner image has
      # had it; this installs it when it is missing.
      - name: Make sure the WiX Toolset is installed
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset -y --no-progress
            echo "C:\Program Files (x86)\WiX Toolset v3.14\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
      # The dmg maker needs appdmg, which npm installs only on macOS and skips without a word when its install fails; one
      # run built without it ("Cannot find module 'appdmg'"). This tries again, and stops here with the reason if it cannot.
      - name: Make sure appdmg is installed
        if: runner.os == 'macOS'
        run: |
          for attempt in 1 2 3; do
            node -e "require('appdmg')" && break
            npm install --no-save --legacy-peer-deps appdmg@0.6.6
          done
          node -e "require('appdmg')"
      - name: Build the web app
        run: npm run build
      - name: Make the installers
        run: npm run electron:make
        env:
          # The Windows ARM runner builds the ARM installer (see forge.config.js); the other runners build for the processor they run on, as before.
          WIX_ARCH: ${{ matrix.os == 'windows-11-arm' && 'arm64' || '' }}
      # VCS portable: the Linux Intel/AMD app as a folder that runs where it is unpacked, with no installation, made for the Atari VCS (AtariOS
      # is Debian 10). The Electron program itself needs glibc 2.25 or older, so it runs on that system as it is; the launcher turns the
      # sandbox off, which needs a setuid helper only an installed package can have.
      - name: Make the VCS portable build
        if: matrix.os == 'ubuntu-latest'
        run: |
          app=$(find out -maxdepth 1 -type d -name '*-linux-x64' | head -1)
          folder="VCS-Game-Maker-VCS-portable"
          mkdir -p "out/make/portable/$folder"
          cp -a "$app/." "out/make/portable/$folder/"
          cp build/linux-portable/VCS-Game-Maker.sh build/linux-portable/README.txt "out/make/portable/$folder/"
          chmod 755 "out/make/portable/$folder/VCS-Game-Maker.sh" "out/make/portable/$folder/vcs-game-maker"
          # A tar.gz keeps the executable bits that a zip downloaded from a release would lose.
          tar -czf "out/make/portable/$folder.tar.gz" -C out/make/portable "$folder"
          rm -rf "out/make/portable/$folder"
      # The macOS runner is Apple Silicon; this adds the Intel build next to it.
      - name: Make the Intel macOS installers
        if: runner.os == 'macOS'
        run: npx electron-forge make --arch=x64
      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.os }}
          path: out/make/**
          if-no-files-found: error

  # The web version: the built site as a zip, to put on any web server.
  web:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # vuetify-loader asks for Vue 2.7 while the project is on Vue 2.6.
      - run: npm ci --legacy-peer-deps
      - run: npm run build
      - name: Zip the site
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: (cd dist && zip -qr "../VCS-Game-Maker-web-$VERSION.zip" .)
      - uses: actions/upload-artifact@v7
        with:
          name: web
          path: VCS-Game-Maker-web-*.zip
          if-no-files-found: error

  release:
    needs: [version, build, web]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: installers
      # Only the files a person downloads (the Windows Setup, the macOS dmg and zip, the Linux deb, rpm and AppImage, the web zip).
      - name: Create or update the release
        run: |
          # Each file gets a name that says which system it is for.
          mkdir release-files
          while IFS= read -r file; do
            name=$(basename "$file")
            case "$name" in
              *.msi) case "$file" in */arm64/*) new="VCS-Game-Maker-$TAG-Windows-arm64-Setup.msi" ;; *) new="VCS-Game-Maker-$TAG-Windows-Setup.msi" ;; esac ;;
              *VCS-portable.tar.gz) new="VCS-Game-Maker-$TAG-Linux-x64-VCS-portable.tar.gz" ;;
              *.deb) case "$name" in *arm64*) arch=arm64 ;; *) arch=amd64 ;; esac; new="VCS-Game-Maker-$TAG-Linux-$arch.deb" ;;
              *.AppImage) case "$name" in *arm64*) arch=arm64 ;; *) arch=x64 ;; esac; new="VCS-Game-Maker-$TAG-Linux-$arch.AppImage" ;;
              *.rpm) case "$name" in *aarch64*) arch=aarch64 ;; *) arch=x86_64 ;; esac; new="VCS-Game-Maker-$TAG-Linux-$arch.rpm" ;;
              VCS-Game-Maker-web-*.zip) new="VCS-Game-Maker-$TAG-Web.zip" ;;
              *.dmg) case "$name" in *arm64*) arch=arm64 ;; *) arch=x64 ;; esac; new="VCS-Game-Maker-$TAG-macOS-$arch.dmg" ;;
              *.zip) case "$name" in *arm64*) arch=arm64 ;; *) arch=x64 ;; esac; new="VCS-Game-Maker-$TAG-macOS-$arch.zip" ;;
              *) continue ;;
            esac
            cp "$file" "release-files/$new"
            # A file downloaded from a release loses its executable bit, so the AppImage goes in a tar.gz, which keeps it: unpacked
            # it can be run as it is.
            case "$new" in
              *.AppImage)
                chmod 755 "release-files/$new"
                tar -czf "release-files/$new.tar.gz" -C release-files "$new"
                rm "release-files/$new" ;;
            esac
          done < <(find installers -type f \( -name '*.msi' -o -name '*.zip' -o -name '*.dmg' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*VCS-portable.tar.gz' \))
          mapfile -t files < <(find release-files -type f)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" --target "$GITHUB_SHA" --title "VCS Game Maker $TAG" --generate-notes
          fi
